spring.application.name=demo

# Database — credentials are externalized. Set DB_USERNAME, DB_PASSWORD as
# environment variables or pass them with -DDB_USERNAME=... -DDB_PASSWORD=...
# An empty default keeps the placeholders parseable so the context loads,
# but JDBC connection will fail fast with a clear "login failed" if missing.
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS:1433;databaseName=automation;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT — secret must be supplied externally. Same convention as the DB credentials.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
