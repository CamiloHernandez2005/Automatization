# ============================================================================
# Test configuration for the 'dev' environment.
#
# - Versioned in git: yes (placeholders only — no real secrets).
# - Override individual values at runtime with: -Dkey=value
#   e.g. java -Dlogin.password=secret -jar target/...-tests-jar-with-dependencies.jar
# - Switch env with: -Denv=staging  (loads config-staging.properties instead).
#
# Do NOT commit real credentials here. Real passwords belong in either:
#   - the developer's shell (-D flag), or
#   - a config-dev-local.properties (gitignored) loaded via -D, or
#   - a CI secret store.
# ============================================================================

# --- Sales Portal under test ---
app.baseUrl=${BASE_URL:}
app.smokeUrl=http://192.168.2.64:5039/

# --- Sales Portal (Login credentials) ---
login.username=${LOGIN_USERNAME:}
login.password=${LOGIN_PASSWORD:}

# --- Playwright runtime ---
# headed=true opens a visible browser; default is headless.
playwright.headed=${HEADLESS:}
# Timeouts in milliseconds, consumed by PlaywrightUtils via System properties.
playwright.timeout.short.ms=1000
playwright.timeout.default.ms=5000
playwright.timeout.long.ms=10000

# --- PC Terminal Test ---
pcterminal.login.username=${PCTERM_LOGIN_USERNAME:}
pcterminal.login.password=${PCTERM_LOGIN_PASSWORD:}
pcterminal.product=${PCTERM_PRODUCT:}

# Tipo de flujo: TOP_UP | PIN | BILL_PAYMENT | CRYPTO | ACTIVATION | PORT_IN | TOOL
pcterminal.flowType=${PCTERM_FLOW_TYPE:TOP_UP}

# Flag global del clerkId (aplica a todos los flujos)
pcterminal.clerkId.enabled=${PCTERM_CLERK_ENABLED:false}
pcterminal.clerkId=${PCTERM_CLERK_ID:}

# TOP_UP (mantiene los nombres originales sin prefijo por retrocompat)
pcterminal.phoneNumber.enabled=${PCTERM_PHONE_ENABLED:false}
pcterminal.phoneNumber=${PCTERM_PHONE_NUMBER:}
pcterminal.amount=${PCTERM_AMOUNT:}

# PIN
pcterminal.pin.amount=${PCTERM_PIN_AMOUNT:}

# BILL_PAYMENT
pcterminal.bill.accountNumber=${PCTERM_BILL_ACCOUNT:}
pcterminal.bill.amount=${PCTERM_BILL_AMOUNT:}

# CRYPTO
pcterminal.crypto.wallet=${PCTERM_CRYPTO_WALLET:}
pcterminal.crypto.amount=${PCTERM_CRYPTO_AMOUNT:}

# ACTIVATION
pcterminal.activation.iccid=${PCTERM_ACT_ICCID:}
pcterminal.activation.imei=${PCTERM_ACT_IMEI:}

# PORT_IN
pcterminal.portin.number=${PCTERM_PORTIN_NUMBER:}
pcterminal.portin.carrier=${PCTERM_PORTIN_CARRIER:}
pcterminal.portin.account=${PCTERM_PORTIN_ACCOUNT:}
pcterminal.portin.pin=${PCTERM_PORTIN_PIN:}
